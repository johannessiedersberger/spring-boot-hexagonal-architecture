version: '3'

services:
  db:
    image: postgres:17.9
    environment:
      - POSTGRESQL_ADMIN_PASSWORD=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - crm

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - path: ./docker/pgadmin/default.env
        required: true
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
    ports:
      - "5050:80"
    links:
      - db
    restart: unless-stopped
    networks:
      - crm

networks:
  crm:
    driver: bridge

volumes:
  postgres:
  pgadmin: